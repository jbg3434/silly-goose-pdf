services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: goose
      POSTGRES_PASSWORD: goose
      POSTGRES_DB: silly_goose
    ports:
      - "5433:5432"
    volumes:
      - sgm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goose -d silly_goose"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  sgm-pgdata:
