    <feTurbulence type="fractalNoise" baseFrequency=".055 .45" numOctaves="3" seed="7" result="fibers"/>
    <feDisplacementMap in="SourceGraphic" in2="fibers" scale="1.7" xChannelSelector="R" yChannelSelector="G" result="rough"/>
