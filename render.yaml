services:
  - type: web
    name: silly-goose-mutual
    runtime: docker
    plan: free
    healthCheckPath: /search/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: silly-goose-db
          property: connectionString
      - key: SGM_PYTHON
        value: /usr/bin/python3
      # Set in the dashboard after deploy (cited answers):
      # - key: OPENCODE_API_KEY
      #   sync: false
    disk:
      name: sgm-storage
      mountPath: /app/storage
      sizeGB: 1

databases:
  - name: silly-goose-db
    plan: free
    postgresMajorVersion: "16"
